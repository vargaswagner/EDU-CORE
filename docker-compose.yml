services:
  postgres:
    image: postgres:17-alpine

    container_name: instituto-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: instituto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instituto"]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - instituto-network

volumes:
  postgres_data:

networks:
  instituto-network:
    driver: bridge
